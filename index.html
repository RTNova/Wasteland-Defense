<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wasteland Defense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto+Mono:wght@400;700&display=swap');
      
      body {
        font-family: 'Roboto Mono', monospace;
        background-color: #1a1a1a;
        color: #e5e5e5;
      }
      
      .font-title {
        font-family: 'Black Ops One', system-ui;
      }
      
      /* Móvil en horizontal (por debajo de lg): barra lateral a la derecha en vez de abajo */
      @media (orientation: landscape) and (max-width: 1023px) {
        .gc-root { flex-direction: row !important; }
        .gc-side { width: 300px !important; height: 100% !important; border-top-width: 0 !important; border-left-width: 1px !important; }
        .gc-towers { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
        .gc-ctrl { padding: 6px !important; gap: 6px !important; }
        .gc-hud { max-width: calc(100% - 9rem) !important; }
      }
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
